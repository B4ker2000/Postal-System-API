<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title data-i18n="pickup_page_title">Pickup Package</title>
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/pickup.css">
    </head>
    <body>
        <div id="navbar-placeholder"></div>

        <main class="main-container">
            <div class="action-card pickup-package">
                <h2 data-i18n="pickup_form_header">Pickup Packages from Your Warehouse</h2>

                <section class="available-section">
                    <h3 data-i18n="pickup_avail_header">Available in Your Warehouse</h3>
                    <div class="table-wrapper">
                        <table class="package-table">
                            <thead>
                                <tr>
                                    <th data-i18n="col_guid">Tracking GUID</th>
                                    <th data-i18n="col_dest">Destination</th>
                                    <th data-i18n="col_fragile">Fragile</th>
                                </tr>
                            </thead>
                            <tbody id="availablePackagesList">
                                <!-- Rows added via JS -->
                            </tbody>
                        </table>
                    </div>
                </section>

                <hr class="divider">

                <section class="manual-section">
                    <h3 data-i18n="manual_header">Manual Entry</h3>
                    <div class="form-group">
                        <label for="pickGuid" data-i18n="guid_label">Tracking GUID</label>
                        <input type="text" id="pickGuid" data-i18n-placeholder="pickup_guid_placeholder" placeholder="Enter Tracking GUID...">
                    </div>
                    <button id="pickBtn" data-i18n="pickup_submit_btn">PICK UP</button>
                </section>
                <div id="message"></div>
            </div>
        </main>

        <script src="../js/i18n.js"></script>
        <script src="../js/api.js"></script>
        <script src="../js/pickup.js"></script>
        <script>
            initLanguage();
        </script>
    </body>
</html>
