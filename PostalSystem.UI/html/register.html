<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register Package - Postal Terminal</title>
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/dashboard.css">
    </head>
    <body>
        <div id="navbar-placeholder"></div>

        <div class="main-container">
            <div class="action-card register-package">
                <h2>Register New Packages</h2>

                <div class="form-group">
                    <label for="regDestCitySelect">Destination City</label>
                    <select id="regDestCitySelect" class="form-control">
                        <option value="">-- Select Destination City --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="regAddress">Destination Address</label>
                    <input type="text" id="regAddress" placeholder="Street, House №, Apartment...">
                </div>

                <div class="form-group fragile">
                    <label for="regFragile" class="fragile-label">
                        <input type="checkbox" id="regFragile">
                        <span>Fragile Package</span>
                    </label>
                </div>

                <button id="regBtn">Register Package</button>
                <div id="message"></div>
            </div>
        </div>

        <script src="../js/api.js"></script>
        <script src="../js/register.js"></script>
    </body>
</html>
