<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer Package</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/transfer.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="container">
        <div class="page-header">
            <h1 data-i18n="transfer_title">Transfer Package to your Warehouse</h1>
            <p data-i18n="transfer_subtitle">Accept packages into your assigned warehouse.</p>
        </div>

        <section class="action-card">
            <div class="input-group">
                <input type="text" id="trackingGuid" placeholder="Enter Tracking GUID..." />
                <button id="transferBtn">
                    <span data-i18n="btn_transfer">Transfer Package</span>
                </button>
            </div>
        </section>

        <section class="inventory-section">
            <h2 data-i18n="my_packages_title">Packages in My Possession</h2>
            <div class="table-container">
                <table id="myPackagesTable">
                    <thead>
                        <tr>
                            <th data-i18n="th_guid">Tracking GUID</th>
                            <th data-i18n="th_address">Destination</th>
                            <th data-i18n="th_fragile">Fragile</th>
                            <th data-i18n="th_action">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Rows added via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/transfer.js"></script>
    <script>
        window.onload = () => {
            loadNavbar();
            initTransferPage();
        };
    </script>
</body>
</html>
